<div class="marca-de-agua-pantalla text-slate-400" aria-hidden="true">
  <span class="marca-de-agua-texto">JAAVISPEED</span>
</div>

<aside 
  class="fixed z-50 transition-all duration-300 select-none text-[#f5f5f7]
         bottom-4 left-1/2 -translate-x-1/2 md:bottom-auto md:left-4 md:top-1/2 md:-translate-y-1/2 md:translate-x-0
         bg-[#1d1d1f]/85 dark:bg-black/75 border border-white/15 backdrop-blur-2xl 
         p-1.5 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] 
         flex flex-row md:flex-col items-center gap-1.5"
  aria-label="Selector de propuestas"
>
  <div class="hidden md:flex px-2.5 pt-1.5 pb-1 items-center justify-between gap-3 border-b border-white/10 mb-0.5 w-full">
    <span class="text-[9px] font-medium tracking-wider text-[#86868b] uppercase">Vistas</span>
    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
  </div>

  <div class="flex flex-row md:flex-col gap-1 items-center">
    <button 
      type="button"
      (click)="seleccionarPropuesta(1)"
      [class.bg-white]="propuestaActiva() === 1"
      [class.text-[#1d1d1f]]="propuestaActiva() === 1"
      [class.shadow-sm]="propuestaActiva() === 1"
      [class.text-[#f5f5f7]]="propuestaActiva() !== 1"
      [class.hover:bg-white/10]="propuestaActiva() !== 1"
      class="flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-medium transition-transform duration-150 active:scale-95 focus-visible:outline-[#0071e3]"
      title="Propuesta 1"
    >
      <span 
        class="w-4 h-4 rounded-md flex items-center justify-center text-[10px] font-semibold"
        [class.bg-black/10]="propuestaActiva() === 1"
        [class.text-[#1d1d1f]]="propuestaActiva() === 1"
        [class.bg-white/10]="propuestaActiva() !== 1"
        [class.text-[#86868b]]="propuestaActiva() !== 1"
      >
        1
      </span>
      <span class="tracking-tight text-[11px] whitespace-nowrap">Propuesta 1</span>
    </button>

    <button 
      type="button"
      (click)="seleccionarPropuesta(2)"
      [class.bg-white]="propuestaActiva() === 2"
      [class.text-[#1d1d1f]]="propuestaActiva() === 2"
      [class.shadow-sm]="propuestaActiva() === 2"
      [class.text-[#f5f5f7]]="propuestaActiva() !== 2"
      [class.hover:bg-white/10]="propuestaActiva() !== 2"
      class="flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-medium transition-transform duration-150 active:scale-95 focus-visible:outline-[#0071e3]"
      title="Propuesta 2"
    >
      <span 
        class="w-4 h-4 rounded-md flex items-center justify-center text-[10px] font-semibold"
        [class.bg-black/10]="propuestaActiva() === 2"
        [class.text-[#1d1d1f]]="propuestaActiva() === 2"
        [class.bg-white/10]="propuestaActiva() !== 2"
        [class.text-[#86868b]]="propuestaActiva() !== 2"
      >
        2
      </span>
      <span class="tracking-tight text-[11px] whitespace-nowrap">Propuesta 2</span>
    </button>

    <button 
      type="button"
      (click)="seleccionarPropuesta(3)"
      [class.bg-white]="propuestaActiva() === 3"
      [class.text-[#1d1d1f]]="propuestaActiva() === 3"
      [class.shadow-sm]="propuestaActiva() === 3"
      [class.text-[#f5f5f7]]="propuestaActiva() !== 3"
      [class.hover:bg-white/10]="propuestaActiva() !== 3"
      class="flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-medium transition-transform duration-150 active:scale-95 focus-visible:outline-[#0071e3]"
      title="Propuesta 3"
    >
      <span 
        class="w-4 h-4 rounded-md flex items-center justify-center text-[10px] font-semibold"
        [class.bg-black/10]="propuestaActiva() === 3"
        [class.text-[#1d1d1f]]="propuestaActiva() === 3"
        [class.bg-white/10]="propuestaActiva() !== 3"
        [class.text-[#86868b]]="propuestaActiva() !== 3"
      >
        3
      </span>
      <span class="tracking-tight text-[11px] whitespace-nowrap">Propuesta 3</span>
    </button>
  </div>
</aside>

<main class="pb-16 md:pb-0">
  @switch (propuestaActiva()) {
    @case (1) {
      <div class="animar-propuesta">
        <app-inicio></app-inicio>
      </div>
    }
    @case (2) {
      <div class="animar-propuesta">
        <app-propuesta-dos></app-propuesta-dos>
      </div>
    }
    @case (3) {
      <div class="animar-propuesta">
        <app-propuesta-tres></app-propuesta-tres>
      </div>
    }
  }
</main>
